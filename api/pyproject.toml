[project]
name = "corelata-api"
version = "0.1.9"
description = "REST API for Corelata"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "corelata",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
s3 = ["corelata[s3]"]  # the hosted demo's Modal image; the air-gapped app image has no S3 client

[project.scripts]
corelata-api = "corelata_api.main:main"

[tool.uv.sources]
corelata = { path = "../engine", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corelata_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "--cov=corelata_api --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["corelata_api"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
