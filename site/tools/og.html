<!doctype html>
<!-- The Open Graph card (1200 × 630). rendered with Chromium at 1200 × 630 to public/og.png (site/README.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Corelata card</title>
    <style>
      @font-face {
        font-family: "Archivo";
        font-weight: 100 900;
        src: url("../public/assets/fonts/archivo-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f3f0e8;
        color: #16181a;
        font-family: "Archivo", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 28px;
      }
      .lockup i {
        width: 20px;
        height: 20px;
        background: #6b3f86;
      }
      .lockup b {
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .lockup span {
        color: #4f5559;
        font-size: 24px;
      }
      h1 {
        font-weight: 800;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.025em;
        margin: auto 0 32px;
      }
      h1 em {
        font-style: normal;
        box-shadow: inset 0 -0.1em 0 #6b3f86;
      }
      p {
        margin: 0;
        font-size: 30px;
        color: #4f5559;
      }
      svg {
        position: absolute;
        right: 80px;
        top: 72px;
        width: 340px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup"><i></i><b>CORELATA</b><span>by Bonham Technologies</span></div>
      <h1>Assessments that show<br />their <em>evidence</em>.</h1>
      <p>Every claim linked to its sources. Audited rule by rule.</p>
    </div>
    <svg viewBox="0 0 400 130">
      <g fill="none" stroke="#8a8477">
        <rect x="0.5" y="0.5" width="127" height="36" />
        <rect x="0.5" y="46.5" width="127" height="36" />
        <rect x="0.5" y="92.5" width="127" height="36" />
      </g>
      <g fill="#16181a" opacity=".16">
        <rect x="12" y="15" width="96" height="6" />
        <rect x="12" y="61" width="72" height="6" />
        <rect x="12" y="107" width="88" height="6" />
      </g>
      <path d="M108 18.5H184.5V64.5H232M84 64.5H232M100 110.5H184.5V64.5" fill="none" stroke="#6b3f86" />
      <rect x="232" y="60" width="8" height="8" fill="#6b3f86" />
      <rect x="248" y="61" width="152" height="6" fill="#16181a" />
      <rect x="248" y="77" width="120" height="6" fill="#16181a" opacity=".4" />
    </svg>
  </body>
</html>
