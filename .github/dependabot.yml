# Weekly dependency updates, grouped so one PR per ecosystem carries the minor and patch bumps.
# The matching labels (dependencies, python, javascript, docker, github_actions) exist on the repo.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "python"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "python"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "javascript"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # @types/node describes the Node runtime, which CI and the image pin to 22: its major
    # follows the runtime when the project moves to a new Node line, not npm.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    labels: ["dependencies", "docker"]
    # A new Python or Node line is the project's decision (the image pins python 3.12 and
    # node 22), so Dependabot opens neither. Docker tags count as semver: node 22 to 24 is a
    # major, which the first rule ignores for every image, but python 3.12 to 3.13 is a minor,
    # which only the second rule catches. Patch and digest updates are not ignored, but the
    # tags float (no patch number, no @sha256 digest), so Dependabot has none to open; a rebuild
    # picks up the line's latest patch.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels: ["dependencies", "github_actions"]
    groups:
      actions:
        patterns:
          - "*"

  # The hosted demo (M19, copied from Coglossa): the front door and the Modal image's pins.
  - package-ecosystem: "npm"
    directory: "/deploy/hosted/vercel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "javascript"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/deploy/hosted/modal"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels: ["dependencies", "python"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
