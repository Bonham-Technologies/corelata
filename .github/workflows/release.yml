name: release
# A tag v<version> publishes the offline bundle (spec §12) as a GitHub release: the tar, its
# .sha256, the manifest, the repository SBOM and SHA256SUMS (the tar, the manifest and the SBOM),
# each with a build provenance attestation (CRL-153; bonham-ops checklist SC-2, SC-3, SC-4). The
# notes end with the version's CHANGELOG.md section. The tag must name the package
# version and a commit on main (deploy/check-release-tag.sh), and the bundle must pass the air-gap
# install test on the runner before anything is published.
#
# Two jobs (CRL-115): `build` gates the tag, tests and builds with a read-only token, and hands
# the files to `publish`, the only job that can write, which runs none of the repository's code.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # the air-gap test (~15 min), then the bundle build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # bundle.sh names the bundle after the tag at HEAD; the gate reads main
          fetch-tags: true
          persist-credentials: false
      - name: the tag names the package version and is on main
        run: deploy/check-release-tag.sh "$GITHUB_REF_NAME" origin/main
      - name: free disk space for the images and the bundle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: the bundle installs and runs on a sealed network
        run: make airgap-test
      - name: build the release bundle
        run: |
          deploy/bundle.sh --keep-stage
          deploy/tests/check-bundle.sh "dist/corelata-${GITHUB_REF_NAME#v}-linux-amd64.tar"
      - name: release notes and the manifest beside the tar
        run: |
          v=${GITHUB_REF_NAME#v}
          cp "dist/corelata-$v/manifest.json" "dist/corelata-$v-manifest.json"
          (cd dist && sha256sum "corelata-$v-linux-amd64.tar" "corelata-$v-manifest.json" >SHA256SUMS)
          {
            echo "Corelata $v, the offline bundle for linux/amd64 (spec §12)."
            echo
            echo "Verify, unpack and install (operator-guide.md section 3, shipped in the bundle):"
            echo
            echo '```sh'
            echo "sha256sum -c corelata-$v-linux-amd64.tar.sha256"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "tar -xf corelata-$v-linux-amd64.tar && cd corelata-$v && ./install.sh"
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "dist/corelata-$v-linux-amd64.tar.sha256")\`"
            echo
            echo "Built from $(git rev-parse --short HEAD); manifest, SBOM and build provenance attached."
            echo
            echo "## Changes"
            awk -v v="$v" '
              /^## / { if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h)
                       if (h == v) { on = 1; next } }
              on' CHANGELOG.md
          } >dist/notes.md
          grep -q '^- ' dist/notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: hand the release files to the publish job
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir release
          mv "dist/corelata-$v-linux-amd64.tar" "dist/corelata-$v-linux-amd64.tar.sha256" \
            "dist/corelata-$v-manifest.json" dist/SHA256SUMS dist/notes.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # the image layers are compressed already
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release; read the dependency graph's SBOM
      actions: read # download the build job's files
      id-token: write # sign the provenance attestations (CRL-153)
      attestations: write # store them
    steps:
      # No checkout: this job runs no code from the repository, only gh and the attest action.
      - name: verify and add the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh run download "$GITHUB_RUN_ID" --name release --dir release
          # the files arrived as the build job wrote them (gh does not check the artifact digest)
          (cd release && sha256sum -c "corelata-$v-linux-amd64.tar.sha256" && sha256sum -c SHA256SUMS)
          # The dependency graph describes the default branch, which the tag gate put this tag on.
          gh api "repos/$GH_REPO/dependency-graph/sbom" --jq .sbom >"release/corelata-$v.spdx.json"
          (cd release && sha256sum "corelata-$v-linux-amd64.tar" "corelata-$v-manifest.json" \
            "corelata-$v.spdx.json" >SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar
            release/*-manifest.json
            release/*.spdx.json
            release/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "release/corelata-$v-linux-amd64.tar" \
            "release/corelata-$v-linux-amd64.tar.sha256" \
            "release/corelata-$v-manifest.json" \
            "release/corelata-$v.spdx.json" \
            release/SHA256SUMS \
            --verify-tag --title "Corelata $v" --notes-file release/notes.md
