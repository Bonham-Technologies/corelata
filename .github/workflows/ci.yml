name: ci
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR makes the older run moot; cancel it to save minutes.
# Runs on the default branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Least privilege: every job only reads the repository. A job that needs more asks for it.
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corelata
          POSTGRES_PASSWORD: corelata
          POSTGRES_DB: corelata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corelata"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CORELATA_TEST_DATABASE_URL: postgresql://corelata:corelata@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      # CRL-95: the scanned-page test reads a page with the real Tesseract (English pack)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corelata
          POSTGRES_PASSWORD: corelata
          POSTGRES_DB: corelata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corelata"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CORELATA_TEST_DATABASE_URL: postgresql://corelata:corelata@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  web:
    # A fork's pull request never runs on the self-hosted runner (CRL-105).
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: generated API types match schema/openapi.json
        run: pnpm gen:api && git diff --exit-code src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a hung stack or browser fails the job instead of holding the runner
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corelata
          POSTGRES_PASSWORD: corelata
          POSTGRES_DB: corelata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corelata"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CORELATA_TEST_DATABASE_URL: postgresql://corelata:corelata@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
        working-directory: api
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make deploy-check
  hosted-web:
    # The hosted demo's front door (deploy/hosted/vercel, M19): Vitest at 95 % and tsc.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/hosted/vercel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: deploy/hosted/vercel/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: deploy/hosted/vercel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  hosted-modal:
    # The hosted demo's Modal app without a Modal account (M19): the settings, start-clean and
    # smoke tests in the engine's environment, so corelata.config is importable and the rendered
    # config is checked instead of skipped (CORELATA_FORBID_SKIP, see conftest.py; --no-cov:
    # the engine's coverage gate is not for these files); then the app's import and functions.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
        working-directory: engine
      # The overlay pins requirements.txt's versions. -W error makes any new warning fail; the one
      # allowed is Starlette's notice that its TestClient prefers httpx2 over httpx (fastapi's
      # testclient, imported by test_settings.py; httpx is what smoke.py and its tests use).
      - run: >-
          CORELATA_FORBID_SKIP=1 uv run --with pyyaml==6.0.3 --with fastapi==0.162.0 --with httpx
          python -m pytest ../deploy/hosted/modal ../deploy/hosted/test_smoke.py
          -q -p no:cacheprovider --no-cov --rootdir ../deploy/hosted/modal
          -W error
          -W "ignore:Using \`httpx\` with \`starlette.testclient\` is deprecated:starlette.exceptions.StarletteDeprecationWarning"
        working-directory: engine
      - run: uv run --no-project --with-requirements deploy/hosted/modal/requirements.txt python deploy/hosted/modal/check_app.py
  site:
    # The public site (site/, CRL-81): links, page metadata, JSON-LD, CSP, vercel.json headers
    # and axe at 1280 and 360 px (site/README.md § Check). It borrows Playwright and axe from web/.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: make site-check
  airgap:
    # Pull requests only: a push to main is a merged pull request that already passed, and the
    # release workflow runs the same test again before it publishes a bundle.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # the image build, then three full stack starts and a restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space for the image and the bundle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: make airgap-test
  ci-status:
    # The one check branch protection requires: green when every job passed or was skipped
    # (airgap runs on pull requests only), red when any job failed or was cancelled.
    # A fork's pull request never runs on the self-hosted runner (CRL-105).
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    needs: [engine, api, web, e2e, deploy, hosted-web, hosted-modal, site, airgap]
    if: always()
    concurrency:
      group: ci-status-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "a required job failed or was cancelled" >&2
            exit 1
          fi
