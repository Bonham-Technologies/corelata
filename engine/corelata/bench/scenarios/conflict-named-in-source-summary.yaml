name: conflict-named-in-source-summary
description: The second source says CONFLICT, so the writer's source summary names it as conflicting (CRL-96) and the report is clean.
statement: Varna port capacity expansion matters to shippers
sources:
  - id: src1
    paragraphs:
      - The port of Varna expanded its container capacity in 2025.
      - Container traffic through Varna rose 40 percent.
