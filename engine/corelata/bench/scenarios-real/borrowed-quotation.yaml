name: borrowed-quotation
description: >-
  The fabricated-quote case, with evidence_quotes required. The statement quotes the Halden
  port authority's words, but the authority's notice only reports its decision indirectly and no
  source contains the quoted words. Copying the statement's quotation into a claim's quotes is a
  fabricated quote, and the engine fails icd203.tc.8 (and icd206.src.2 when a key judgment cites
  the claim) with "quote not found in …"; the scenario expects that engine failure at least
  once. A good model then replaces the borrowed words with the notice's own in one revision and
  delivers a clean report; a good model that quotes the notice from the start shows
  icd203.tc.8 as missed (the trap did not fire), not as a wrong answer. A weak model keeps the
  borrowed quotation, or drops the quote, and spends every revision with the engine finding open.
statement: >-
  Halden's port authority warned that the tanker restriction "will shut the oil terminal for the
  whole winter"
pipeline:
  evidence_quotes: required
sources:
  - id: src1
    name: halden-port-notice.txt
    paragraphs:
      - >-
        Halden Port Authority, notice to shipping 26/41, 14 October 2026. Tanker berths 3 and 4 at
        the oil terminal will be closed to vessels over 40,000 tonnes deadweight from 1 November
        2026 while the jetty piles are repaired.
      - >-
        The authority expects the repairs to take until mid-March 2027. Smaller tankers may use
        berth 2 by appointment with the harbour master.
  - id: src2
    name: halden-courier-report.md
    paragraphs:
      - >-
        Halden Courier, 16 October 2026. Shipping agents said the tanker restriction would send
        most crude cargoes to Kelmar until the spring, and two refiners have asked the authority
        to phase the repairs.
      - >-
        The port authority's spokesperson declined to say whether the work could be shortened.
expect:
  state: completed
  status_in: [clean]
  iterations_max: 2
  gate_supported_in: [true]
  rules_must_fail: [icd203.tc.8]
  rules_must_pass: [icd203.tc.8, icd206.src.2]
